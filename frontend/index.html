<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>Pinterest-Proyect</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:Arial, sans-serif;

    background:
    linear-gradient(
        135deg,
        #e60023,
        #ff6b81
    );

    height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;
}

.login-card{

    background:white;

    width:400px;

    padding:40px;

    border-radius:25px;

    box-shadow:
    0 10px 30px rgba(0,0,0,.2);

    text-align:center;
}

.logo{

    color:#e60023;

    font-size:40px;

    font-weight:bold;

    margin-bottom:20px;
}

h2{

    margin-bottom:20px;
}

input{

    width:100%;

    padding:12px;

    margin-top:10px;

    border-radius:15px;

    border:1px solid #ccc;
}

button{

    width:100%;

    margin-top:15px;

    padding:12px;

    border:none;

    border-radius:20px;

    cursor:pointer;

    font-weight:bold;
}

.btn-login{

    background:#e60023;

    color:white;
}

.btn-registro{

    background:#efefef;
}

button:hover{

    opacity:.9;
}

</style>


</head>

<body>

<div class="login-card">

    <div class="logo">

        Pinterest Project

    </div>

    <h2>

        Iniciar sesión

    </h2>

    <input
    type="text"
    id="username"
    placeholder="Usuario">

    <input
    type="password"
    id="password"
    placeholder="Contraseña">

    <button
    class="btn-login"
    onclick="login()">

    Iniciar sesión

    </button>

    <button
    class="btn-registro"
    onclick="registro()">

    Registrarse

    </button>

</div>

<script>

/* REGISTRO */

async function registro(){

    const username =
        document.getElementById('username').value;

    const password =
        document.getElementById('password').value;

    const respuesta = await fetch(

        'https://pinterest-backend-br9e.onrender.com/registro',

        {

            method:'POST',

            headers:{
                'Content-Type':'application/json'
            },

            body: JSON.stringify({

                username,
                password

            })

        }

    );

    const datos =
        await respuesta.json();

    alert(datos.mensaje);

}

/* LOGIN */

async function login(){

    const username =
        document.getElementById('username').value;

    const password =
        document.getElementById('password').value;

    const respuesta = await fetch(

        'https://pinterest-backend-br9e.onrender.com/login',

        {

            method:'POST',

            headers:{
                'Content-Type':'application/json'
            },

            body: JSON.stringify({

                username,
                password

            })

        }

    );

    const datos =
        await respuesta.json();

    if(datos.usuario){

        localStorage.setItem(

            'usuario',

            datos.usuario

        );

        localStorage.setItem(

            'usuario_id',

            datos.usuario_id

        );

        window.location.href =
            'feed.html';

    }
    else{

        alert(

            datos.error ||

            'Error al iniciar sesión'

        );

    }

}

</script>

</body>

</html>
